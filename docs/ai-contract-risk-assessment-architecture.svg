<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="AI-Powered Contract Risk Assessment - System Architecture">
  <defs>
    <style>
      .title { font: 700 64px 'Segoe UI', Arial, sans-serif; fill:#111; }
      .h1 { font: 700 50px 'Segoe UI', Arial, sans-serif; fill:#111; }
      .h2 { font: 700 24px 'Segoe UI', Arial, sans-serif; fill:#111; }
      .h3 { font: 700 20px 'Segoe UI', Arial, sans-serif; fill:#111; }
      .body { font: 500 18px 'Segoe UI', Arial, sans-serif; fill:#222; }
      .small { font: 500 16px 'Segoe UI', Arial, sans-serif; fill:#222; }
      .panel { fill:#f5fbff; stroke:#4a88b5; stroke-width:2.5; }
      .subpanel { fill:#ffffff; stroke:#9d87c9; stroke-width:2; }
      .insights { fill:#faf5ff; stroke:#9d87c9; stroke-width:2.5; }
      .arrow { stroke:#4e6387; stroke-width:3.2; fill:none; marker-end:url(#arrow); }
      .icon { stroke:#3b63b0; stroke-width:3; fill:none; }
    </style>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edf7ff"/>
      <stop offset="100%" stop-color="#e6f1ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#4e6387" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="92" text-anchor="middle" class="title">AI-Powered Contract Risk Assessment - System Architecture</text>

  <!-- User Interface -->
  <rect x="54" y="430" width="220" height="250" rx="12" class="panel"/>
  <rect x="88" y="460" width="130" height="90" rx="10" fill="#eef7ff" stroke="#4a88b5" stroke-width="2"/>
  <rect x="104" y="475" width="100" height="12" rx="6" fill="#9ec4e0"/>
  <circle cx="111" cy="481" r="3" fill="#3b63b0"/>
  <circle cx="123" cy="481" r="3" fill="#3b63b0"/>
  <circle cx="135" cy="481" r="3" fill="#3b63b0"/>
  <path d="M122 510 L171 530 L142 540 Z" fill="#3a75b4" opacity="0.95"/>
  <line x1="122" y1="510" x2="142" y2="540" class="icon"/>
  <text x="164" y="658" text-anchor="middle" class="h2">User Interface</text>
  <text x="164" y="690" text-anchor="middle" class="body">(Streamlit App)</text>

  <!-- Document Processing -->
  <rect x="324" y="485" width="490" height="300" rx="12" class="panel"/>
  <text x="570" y="550" text-anchor="middle" class="h1" font-size="36">Document Processing</text>

  <rect x="350" y="580" width="180" height="210" rx="10" class="subpanel"/>
  <path d="M420 630 h48 l18 18 v56 h-66 z" fill="#ecf0ff" stroke="#6158b7" stroke-width="4"/>
  <line x1="468" y1="630" x2="468" y2="648" stroke="#6158b7" stroke-width="4"/>
  <line x1="468" y1="648" x2="486" y2="648" stroke="#6158b7" stroke-width="4"/>
  <text x="440" y="748" text-anchor="middle" class="h2">PDF Upload</text>

  <rect x="578" y="580" width="210" height="210" rx="10" class="subpanel"/>
  <circle cx="645" cy="650" r="22" fill="#f0edff" stroke="#6d5ac8" stroke-width="5"/>
  <circle cx="700" cy="620" r="15" fill="#f0edff" stroke="#6d5ac8" stroke-width="5"/>
  <circle cx="710" cy="670" r="12" fill="#f0edff" stroke="#6d5ac8" stroke-width="5"/>
  <text x="683" y="732" text-anchor="middle" class="h2">Docling</text>
  <text x="683" y="760" text-anchor="middle" class="body">(Document</text>
  <text x="683" y="786" text-anchor="middle" class="body">Parsing &amp; Chunking)</text>

  <!-- Orchestration -->
  <rect x="760" y="145" width="520" height="310" rx="12" fill="url(#coreGrad)" stroke="#4a88b5" stroke-width="2.5"/>
  <text x="1020" y="210" text-anchor="middle" class="h1" font-size="40">Orchestration &amp; AI Core</text>

  <rect x="790" y="240" width="210" height="220" rx="10" class="subpanel"/>
  <circle cx="885" cy="305" r="12" fill="#eef7ff" stroke="#3a75b4" stroke-width="4"/>
  <circle cx="920" cy="310" r="10" fill="#f3ecff" stroke="#7252b7" stroke-width="4"/>
  <circle cx="950" cy="316" r="8" fill="#f3ecff" stroke="#7252b7" stroke-width="4"/>
  <path d="M885 292 C885 272, 912 272, 912 295" class="icon"/>
  <path d="M921 320 C921 345, 951 345, 951 322" class="icon"/>
  <text x="895" y="376" text-anchor="middle" class="h2">LangGraph</text>
  <text x="895" y="406" text-anchor="middle" class="body">(Stateful</text>
  <text x="895" y="432" text-anchor="middle" class="body">Workflow)</text>

  <rect x="1050" y="240" width="210" height="220" rx="10" class="subpanel"/>
  <path d="M1120 305 c-18 -18 10 -48 30 -30 l12 12 c18 18 -12 48 -30 30 z" fill="#eef7ff" stroke="#6d5ac8" stroke-width="5"/>
  <path d="M1140 325 c18 18 48 -10 30 -30 l-12 -12 c-18 -18 -48 12 -30 30 z" fill="#eef7ff" stroke="#6d5ac8" stroke-width="5"/>
  <text x="1155" y="376" text-anchor="middle" class="h2">LangChain</text>
  <text x="1155" y="406" text-anchor="middle" class="body">(RAG Chain)</text>

  <!-- Vector DB -->
  <rect x="910" y="580" width="220" height="250" rx="12" class="panel"/>
  <ellipse cx="1020" cy="640" rx="48" ry="20" fill="#d8ecff" stroke="#2d77b4" stroke-width="4"/>
  <path d="M972 640 v62 c0 11 22 20 48 20 s48-9 48-20 v-62" fill="#d8ecff" stroke="#2d77b4" stroke-width="4"/>
  <ellipse cx="1020" cy="702" rx="48" ry="20" fill="#d8ecff" stroke="#2d77b4" stroke-width="4"/>
  <text x="1020" y="758" text-anchor="middle" class="h1" font-size="38">Vector</text>
  <text x="1020" y="798" text-anchor="middle" class="h1" font-size="38">Database</text>
  <text x="1020" y="830" text-anchor="middle" class="body">(Milvus)</text>

  <!-- LLM -->
  <rect x="1325" y="425" width="235" height="300" rx="12" class="panel"/>
  <path d="M1445 495 c24 -30 78 -15 88 26 14 59 -38 109 -95 96 -31 -6 -58 -31 -63 -62 -7 -38 15 -59 32 -60" fill="#eaf4ff" stroke="#2d77b4" stroke-width="5"/>
  <path d="M1443 513 c17 7 20 24 9 40" class="icon"/>
  <path d="M1478 514 c8 10 9 24 2 36" class="icon"/>
  <path d="M1508 520 c6 9 8 21 3 31" class="icon"/>
  <text x="1442" y="620" text-anchor="middle" class="h1" font-size="42">Large</text>
  <text x="1442" y="662" text-anchor="middle" class="h1" font-size="42">Language</text>
  <text x="1442" y="704" text-anchor="middle" class="h1" font-size="42">Model</text>
  <text x="1442" y="742" text-anchor="middle" class="body">(Hugging Face /</text>
  <text x="1442" y="770" text-anchor="middle" class="body">Llama 3)</text>

  <!-- Output and insights -->
  <rect x="1580" y="310" width="260" height="470" rx="12" class="insights" transform="translate(-140,0)"/>
  <text x="1570" y="380" text-anchor="middle" class="h1" font-size="42" transform="translate(-140,0)">Output &amp;</text>
  <text x="1570" y="426" text-anchor="middle" class="h1" font-size="42" transform="translate(-140,0)">Insights</text>

  <rect x="1470" y="450" width="200" height="70" rx="10" class="subpanel"/>
  <text x="1570" y="495" text-anchor="middle" class="h2" transform="translate(-140,0)">Risk Scores</text>

  <rect x="1470" y="540" width="200" height="95" rx="10" class="subpanel"/>
  <text x="1570" y="582" text-anchor="middle" class="h2" transform="translate(-140,0)">Clause</text>
  <text x="1570" y="614" text-anchor="middle" class="h2" transform="translate(-140,0)">Extraction</text>

  <rect x="1470" y="650" width="200" height="145" rx="10" class="subpanel"/>
  <circle cx="1520" cy="710" r="20" fill="#f5f0ff" stroke="#6d5ac8" stroke-width="5" transform="translate(-140,0)"/>
  <line x1="1534" y1="724" x2="1548" y2="738" stroke="#6d5ac8" stroke-width="5" transform="translate(-140,0)"/>
  <rect x="1565" y="688" width="50" height="38" rx="8" fill="#f5f0ff" stroke="#6d5ac8" stroke-width="5" transform="translate(-140,0)"/>
  <text x="1570" y="770" text-anchor="middle" class="h2" transform="translate(-140,0)">Q&amp;A Chatbot</text>

  <!-- Arrows -->
  <path d="M274 555 L324 555" class="arrow"/>
  <path d="M530 685 L578 685" class="arrow"/>
  <path d="M814 685 L910 685" class="arrow"/>
  <path d="M1020 580 L1020 460" class="arrow"/>
  <path d="M1020 460 L1020 580" class="arrow"/>
  <path d="M1000 350 L1050 350" class="arrow"/>
  <path d="M1260 350 L1425 350 L1425 425" class="arrow"/>
  <path d="M1560 575 L1700 575" class="arrow" transform="translate(-140,0)"/>
  <path d="M1325 575 L1305 575" class="arrow"/>

  <!-- outer feedback loop -->
  <path d="M760 350 L150 350 L150 430" class="arrow"/>
  <path d="M1700 780 L1700 850 L150 850 L150 700" class="arrow" transform="translate(-140,0)"/>
</svg>
